name: Build Android APK

on:
  push:
    paths:
      - 'index.html'
      - 'www/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor deps
        run: npm install

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp index.html www/index.html
          # bundle extra static assets if present (e.g. maps) without failing when absent
          if [ -d assets ]; then cp -r assets www/assets; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets into native project
        run: npx cap copy android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kuper-kidburg-phone1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuper-kidburg-phone1-debug-apk
          path: kuper-kidburg-phone1-debug.apk
          if-no-files-found: error
